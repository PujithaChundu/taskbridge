<!DOCTYPE html>
<html>
<head>
    <title>All Tasks</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-card" style="width:90%; max-width:1000px;">
    <h1>All Tasks</h1>

    {% if tasks %}
        <table border="1" cellpadding="10" cellspacing="0" width="100%">
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Deadline</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th>Actions</th>
            </tr>

            {% for task in tasks %}
            <tr>
                <td>{{ task[1] }}</td>
                <td>{{ task[2] }}</td>
                <td>{{ task[3] }}</td>
                <td>{{ task[4] }}</td>
                <td>{{ task[5] }}</td>
                <td>
                    <a href="/edit-task/{{ task[0] }}">Edit</a> |
                    <a href="/delete-task/{{ task[0] }}" onclick="return confirm('Are you sure you want to delete this task?');">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No tasks found.</p>
    {% endif %}

    <br>
    <button onclick="window.location.href='/admin-dashboard'">Back</button>
</div>

</body>
</html>
